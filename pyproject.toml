[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotier-powerdns-sync"
version = "0.1.0"
description = "List ZeroTier network members and publish their addresses to PowerDNS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
zt-pdns-sync = "zt_pdns_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
